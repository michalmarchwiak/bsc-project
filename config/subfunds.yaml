# Sub-fundusze (SF) i ich skład. Wewnątrz SF wagi równe między tickerami dostępnymi
# w dniu rebalansowania (macierz A, look-through x = AᵀW).
# deterministic: true – stopa zwrotu w horyzoncie znana ex ante (margines deterministyczny, poza kopułą).
#
# Uniwersa (pf.universe, pf.portfolio.load_subfunds):
#   pit   – skład SF akcyjnych wybierany punktowo w czasie z szerszej puli spółek (klucz ``select``);
#   fixed – pierwotna stała lista tickerów (dobrana z perspektywy 2026 r. – obciążenie doborem ex post);
#           służy do porównania z wcześniejszymi przebiegami.
# Aktywne uniwersum: klucz ``universe`` albo zmienna środowiskowa PF_UNIVERSE (ma pierwszeństwo).
universe: pit

# Wybór składu (SF z kluczem ``select``, pf.universe): w dacie rebalansowania t do SF wchodzi ``top`` spółek puli
# o największej średniej z ostatnich ``lookback_months`` miesięcznych median dziennej wartości obrotu (Close·Volume,
# waluta notowania), spośród spółek dopuszczonych w oknie estymacji przed t (min_obs, config/models.yaml). Ranking
# obrotów jest ustalany w rewizji r ≤ t (pierwsza sesja miesiąca ``review_month``) z miesięcy zakończonych przed r,
# więc skład zmienia się raz w roku albo gdy spółka po debiucie uzyska wymaganą historię. Tickery ``core``
# (np. ETF-y na złoto) należą do SF zawsze. Reguła używa wyłącznie danych sprzed t.
selection:
  turnover_path: "data/processed/turnover_monthly.csv"    # data_manipulation.py
  lookback_months: 12
  review_month: 1

# SF wspólne dla obu uniwersów (ETF-y i obligacje oszczędnościowe).
common:
  SF3: &sf3
    name: "Akcje rynków rozwiniętych ex-USA"
    tickers: [EFA, EWJ, EWU, EWG, EWQ, EWL, EWC, EWA, EWN, EWS]
  SF4: &sf4
    name: "Akcje rynków wschodzących"
    tickers: [EEM, MCHI, INDA, EWZ, EWW, EWT, THD, IDX, TUR, EZA]
  SF5: &sf5
    name: "Obligacje skarbowe USA"
    tickers: [SHY, IEI, IEF, TLT, GOVT, VGSH, VGIT, VGLT, SCHO, SCHR]
  SF6: &sf6
    name: "Obligacje korporacyjne IG"
    tickers: [LQD, VCIT, VCSH, IGSB, IGIB, USIG]
  SF7: &sf7
    name: "Obligacje high yield"
    tickers: [HYG, JNK, ANGL, FALN]
  SF10: &sf10
    name: "Obligacje oszczędnościowe Skarbu Państwa"
    deterministic: true
    tickers: [OTS.SP, DOS.SP, DOR.SP, ROR.SP, TOZ.SP, TOS.SP, COI.SP, EDO.SP]

universes:

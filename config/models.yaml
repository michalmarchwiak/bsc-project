# Marginesy, R-vine i comiesięczne rebalansowanie.

returns:
  path: "data/processed/log_returns_pln.csv"   # dzienne log-stopy zwrotu w PLN

margins:
  mean: "AR"            # AR(1)
  vol: "GJR-GARCH"      # GJR-GARCH(1,1)
  dist: "skewt"         # skośny t Hansena
  scale: 100.0          # estymacja na stopach ×100 (stabilność numeryczna)
  sim_eps_cap: 2.0      # symulacja: |ε| ≤ k·max|ε̂| z okna (k; null – bez ograniczenia)

rvine:                              # wspólne dla rvine, cvine, dvine
  truncation: 3                     # liczba pięter (drzew) z kopułami; wyższe = niezależność
  families: [gauss, t, clayton, gumbel, frank]
  rotations: true                   # obroty 90/180/270 dla Claytona i Gumbela
  criterion: aic                    # wybór rodziny: aic | bic
  estimation: mle                   # itau (odwrócenie τ) | mle (sekwencyjna MNW startująca z itau)
  indep_test_level: 0.05            # test niezależności (τ Kendalla); null = wyłączony
  t_df_bounds: [2.05, 30.0]

dependence:                         # modele zależności (pf.models.dependence)
  models: [rvine, cvine, dvine, gauss, student_t, indep, empirical]
  reference: rvine                  # model odniesienia w teście Vuonga
  vuong_level: 0.05
  psd_eig_min: 1.0e-4               # min. wartość własna R po naprawie Highama
  full_sample_min_coverage: 0.90    # raport pełnej próby: aktywa z ≥ 90% sesji próby (panel bez skracania)
  higham_tol: 1.0e-9
  higham_max_iter: 500
  student_t:
    df_grid: [2.5, 3, 3.5, 4, 5, 6, 7, 8, 10, 12, 15, 20, 25, 30, 40, 50]   # profil wiarygodności ν
    refine: true                    # doprecyzowanie ν między sąsiednimi punktami siatki

rebalance:
  window_days: 1260                 # okno estymacji (≈ 5 lat sesyjnych)
  min_obs: 750                      # minimalna liczba obserwacji aktywa w oknie
  horizon_days: 21                  # horyzont scenariuszy (≈ 1 miesiąc)
  n_scenarios: 10000               # bieżące rebalansowanie
  backtest_scenarios: 2000          # daty historyczne (koszt symulacji ≈ 6 s / 1000 scenariuszy)
  seed: 20110101
  es_alpha: 0.975
  # Skład każdego sub-funduszu: max E[R] przy ES_α ≤ ES_α portfela równych wag tego sub-funduszu.
  asset_max_weight: 0.30            # limit wagi tickera w sub-funduszu (min. 1/n przy n < 4 aktywach)
  # Koszt transakcyjny jako ułamek wartości transakcji (kupna + sprzedaże); 0 = bez kosztów.
  transaction_cost: 0.001

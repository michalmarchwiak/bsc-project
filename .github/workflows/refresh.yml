name: refresh-market-data

# Dzienne odświeżenie danych modułu opcji po zamknięciu NYSE (16:00 ET = 20:00/21:00 UTC);
# 22:37 UTC zostawia zapas na publikację plików Cboe. Wyniki są commitowane do repozytorium.
on:
  schedule:
    - cron: "37 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-market-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Indeksy zmienności Cboe
        run: python -m pf.data.vol_indices
      - name: Instrumenty bazowe
        run: python -m pf.data.underlyings
      - name: Zrzut łańcuchów opcji (yfinance)
        run: python -m pf.data.options_snapshot
      - name: Commit artefaktów
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/market artifacts/raw/options_snapshots artifacts/manifest.json
          git diff --cached --quiet || git commit -m "Odświeżenie danych rynkowych $(date -u +%F) [skip ci]"
          git push

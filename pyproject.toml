[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pf"
version = "0.1.0"
description = "Analiza ryzyka funduszu z uwzględnieniem zależności aktywów"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.11",
    "requests>=2.31",
    "yfinance>=0.2.40",
    "pyarrow>=14",
    "pyyaml>=6",
    "arch>=7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = ["network: testy wymagające dostępu do internetu (domyślnie pomijane)"]
addopts = "-m 'not network'"
